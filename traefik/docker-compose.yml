services:
  traefik:
    image: traefik:v3.7.17@sha256:92627e6a99f71b8e46634acea28130b9f14bec5d9887ad15161007e1b652afe1
    container_name: traefik
    restart: unless-stopped
    network_mode: "host"
    command:
      - --global.sendanonymoususage=false
      # - --api.insecure=true

      # Entrypoints
      - --entrypoints.https.address=:443
      - --entrypoints.http.address=:80
      ## Redirect http to https
      - --entrypoints.http.http.redirections.entryPoint.to=https
      - --entrypoints.http.http.redirections.entryPoint.scheme=https
      ## Only geoblock requests to HTTPS (443) so that HTTP (80) can still be redirected to HTTPS
      - --entrypoints.https.http.middlewares=geoblock
      ## TLS for HTTPS entrypoint
      - --entrypoints.https.http.tls=true
      - --entrypoints.https.http.tls.certResolver=myresolver
      ## Create wildcard certificate, otherwise Traefik will create a certificate for each subdomain
      ### NOTE : Entrypoint http.tls settings apply only when a router does not define its own tls section.
      ### Defining a router tls section means Traefik does not merge that configuration with the entrypoint defaults for that router. 
      - --entrypoints.https.http.tls.domains[0].main=${DOMAIN:?Missing variable DOMAIN}
      - --entrypoints.https.http.tls.domains[0].sans[0]=*.${DOMAIN:?Missing variable DOMAIN}
      - --entrypoints.https.http.tls.domains[0].sans[1]=*.internal.${DOMAIN:?Missing variable DOMAIN}

      # Certificate resolver
      - --certificatesresolvers.myresolver.acme.dnschallenge=true
      - --certificatesresolvers.myresolver.acme.dnschallenge.provider=duckdns
      - --certificatesresolvers.myresolver.acme.dnschallenge.propagation.disableChecks=true
      - --certificatesresolvers.myresolver.acme.dnschallenge.propagation.delayBeforeChecks=60
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.myresolver.acme.email=${ACME_EMAIL:?Missing variable ACME_EMAIL}

      # Metrics
      - --metrics.prometheus=true
      - --entryPoints.metrics.address=:${METRICS_PORT:-8081}
      - --metrics.prometheus.entryPoint=metrics

      # Logs
      - --log.level=WARN
      - --log.filePath=/logs/debug.log
      ## Access logs
      - --accesslog=true
      - --accesslog.filepath=/logs/access.log
      - --accesslog.format=json
      - --accesslog.bufferingsize=100

      # Plugins
      ## Geoblock
      - --experimental.plugins.geoblock.moduleName=github.com/PascalMinder/geoblock
      - --experimental.plugins.geoblock.version=v0.3.3

      # Dynamic Configuration
      ## Docker provider
      # - --providers.docker=true
      # - --providers.docker.exposedbydefault=false
      # - --providers.docker.defaultRule=Host(`{{ index .Labels "com.docker.compose.service" }}.${DOMAIN:?Missing variable DOMAIN}`)

      ## File provider
      - --providers.file=true
      - --providers.file.directory=/etc/traefik/config
      - --providers.file.watch=true

    # ports:
    #   - 80:80
    #   - 443:443
    #   - ${WEB_PORT:-8080}:8080
    # networks:
    #   - monitoring
    # expose:
    #   - ${METRICS_PORT:-8081}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/letsencrypt:/letsencrypt
      - ${DIRECTORY}/traefik/logs:/logs
      - ${DIRECTORY}/traefik/config:/etc/traefik/config
    environment:
      - TZ=${TZ:-Etc/UTC}
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:?Missing variable DUCKDNS_TOKEN}
    labels:
      - homepage.group=Network
      - homepage.name=Traefik
      - homepage.icon=traefik.png
      - homepage.instance.internal.href=${HOST_URL:-http://localhost}:${WEB_PORT:-8080}
      - homepage.description=Cloud Native Application Proxy
      # - homepage.widget.type=traefik # requires "api.insecure=true"
      # - homepage.widget.url=${HOST_URL:-http://localhost}:${WEB_PORT:-8080}