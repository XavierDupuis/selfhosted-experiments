services:
  socket-proxy:
    image: 11notes/socket-proxy:2.2.0@sha256:eeb341c66337b95eaed9e710b12754e0cd59c4cbc521b8324ff906787c69934e
    container_name: docker-socket-proxy
    restart: "unless-stopped"
    read_only: true
    user: "0:${DOCKER_GID:?Missing variable DOCKER_GID}" # root:docker
    environment:
      - TZ=${TZ:-Etc/UTC}
      - SOCKET_PROXY_HTTP_LISTEN_IP=${LISTEN_IP:-127.0.0.1}
    volumes:
      - "/run/docker.sock:/run/docker.sock:ro" 
      - "socket-proxy.run:/run/proxy"
    ports:
      - "${PORT:-2375}:2375"

volumes:
  socket-proxy.run: