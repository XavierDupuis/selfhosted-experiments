services:
  dockhand:
    image: fnsys/dockhand:v1.0.49@sha256:5c9bb5e3c35a7804e7945578e3dacddb9ff847ccc2e0f58b9045fa1327030837
    container_name: dockhand
    restart: unless-stopped
    ports:
      - ${WEB_PORT:-3000}:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DIRECTORY:?Missing variable DIRECTORY}/dockhand:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.dockhand.tls.certresolver=myresolver
      - traefik.http.services.dockhand.loadbalancer.server.port=9000
      - homepage.instance.internal.group=Management
      - homepage.instance.internal.name=${HOMEPAGE_NAME:-Dockhand}
      - homepage.instance.internal.icon=dockhand.png
      # - homepage.instance.public.href=https://dockhand.${DOMAIN:?Missing variable DOMAIN}
      - homepage.instance.internal.href=${HOST_URL:-http://localhost}:${WEB_PORT:-3000}
      - homepage.instance.internal.description=Modern Docker management for everyone.
      - homepage.instance.internal.widget.type=dockhand
      - homepage.instance.internal.widget.url=${HOST_URL:-http://localhost}:${WEB_PORT:-3000}
      - homepage.instance.internal.widget.key=${DOCKHAND_API_KEY}
