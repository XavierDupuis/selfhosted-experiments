services:
  gitea:
    image: gitea/gitea:28.2.0@sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__security__SECRET_KEY=${GITEA__security__SECRET_KEY:?Missing variable GITEA__security__SECRET_KEY}
      - GITEA__security__INTERNAL_TOKEN=${GITEA__security__INTERNAL_TOKEN:?Missing variable GITEA__security__INTERNAL_TOKEN}
    volumes:
      - ${DIRECTORY:-Missing variable DIRECTORY}/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - ${WEB_PORT:?-3000}:3000
      - ${SSH_PORT:?-22}:22
    labels:
      - traefik.enable=true
      - traefik.http.routers.gitea.tls.certresolver=myresolver
      - traefik.http.services.gitea.loadbalancer.server.port=3000
      - homepage.instance.internal.group=Development
      - homepage.instance.internal.name=Gitea
      - homepage.instance.internal.icon=gitea.png
      - homepage.instance.internal.href=${HOST_URL:-http://localhost}:${WEB_PORT:-3000}
      - homepage.instance.internal.description=Git with a cup of tea